name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Fix hyperlog repository and coordinates
        run: |
          sed -i "s|com.hypertrack:hyperlog:0.0.10|com.github.hypertrack:hyperlog-android:0.0.10|g" app/build.gradle
          sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://jitpack.io' }|g" build.gradle app/build.gradle
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: alertify-apk
          path: app/build/outputs/apk/debug/*.apk
